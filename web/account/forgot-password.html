<!doctype html>

<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quên mật khẩu — Fw12 Floral</title>
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

<div id="site-header"></div>

<main>
    <div class="login-container">
        <div class="login-header">
            <div class="icon mb-3"><i class="fa-solid fa-key"></i></div>
            <h1 class="h2">Quên mật khẩu?</h1>
        </div>

        <form id="forgotPasswordForm">
            <!-- Email -->
            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <div class="input-box">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" name="email" class="form-text-input" placeholder="Nhập email" required>
                </div>
            </div>
            <button type="submit" class="login-button" id="submitButton">Đặt lại mật khẩu</button>
            <p id="loginError" class="login-error" role="alert">text</p>
        </form>

        <div class="register-text">
            <a href="login.html"><i class="fa-solid fa-arrow-left"></i> Quay lại đăng nhập</a>
        </div>
        <div class="register-text">
            Chưa có tài khoản?
            <a href="register.html">Đăng ký ngay</a>
        </div>
    </div>
    <div id="rePassSection" hidden>
        <h2>Đặt lại mật khẩu</h2>
        <p>Nhập mã OTP được gửi đến email và tạo mật khẩu mới.</p>
        <form id="rePassForm">
            <!-- Password -->
            <div class="form-group">
                <label for="password" class="form-label">Mật khẩu</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" name="password" class="form-text-input"
                           placeholder="Nhập mật khẩu" required>
                    <button type="button" class="toggle-password" id="togglePassword">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>
            <!-- Confirm password -->
            <div class="form-group">
                <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-text-input"
                           placeholder="Nhập lại mật khẩu" required>
                    <button type="button" class="toggle-password" id="toggleConfirmPassword">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>
            <!-- otp -->
            <div class="form-group">
                <label for="otp" class="form-label">Mã OTP</label>
                <input type="text" id="otp" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="Nhập mã OTP" required>
            </div>
            <button type="submit" id="changePassButton">Đổi mật khẩu</button>
        </form>
        <button type="button" id="resendOtpButton" disabled>Gửi lại mã (60s)</button>
        <p id="rePassMessage" role="status"></p>
    </div>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/common.js"></script>
<script src="../js/api.js"></script>
<script src="../js/pages/forgot-password.js"></script>
</body>
</html>
