<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập — Fw12 Floral</title>
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
<div id="site-header"></div>
<main>
    <div class="login-container">
        <div class="login-header">
            <div class="icon mb-3"><i class="fa-solid fa-seedling"></i></div>
            <h1 class="h2">Đăng nhập</h1>
        </div>

        <!--form-->
        <form id="loginForm">
            <!-- Email -->
            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <div class="input-group">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" name="email" class="form-text-input" placeholder="Nhập email"
                           required>
                </div>
            </div>
            <!-- Password -->
            <div class="form-group">
                <label for="password" class="form-label">Mật khẩu</label>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" name="password" class="form-text-input"
                           placeholder="Nhập mật khẩu" required>
                    <button type="button" class="toggle-password" id="togglePassword"><i class="fa-regular fa-eye"></i></button>
                </div>
            </div>
            <!-- Submit button -->
            <button type="submit" class="login-button">Đăng nhập</button>
            <div class="login-divider">
                <span>hoặc</span>
            </div>
            <!-- Google login -->
            <button type="button" class="google-login-button" id="googleLogin">
                <i class="fa-brands fa-google"></i>
                <span>Đăng nhập bằng Google</span>
            </button>
        </form>
        <!-- Register -->
        <div class="register-text">
            Chưa có tài khoản?
            <a href="register.html">Đăng ký ngay</a>
        </div>
    </div>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/common.js"></script>
<script src="../js/api.js"></script>
<script src="../js/pages/login.js"></script>
</body>
</html>
