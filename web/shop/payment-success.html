<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanh toán thành công — Fw12 Floral</title>
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap">
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body data-nav="">

<div id="site-header"></div>

<main>
  <section class="section pt-5">
    <div class="container" style="max-width:640px">
      <div id="noOrder" class="text-center py-5" hidden>
        <p class="text-muted-fw">Không tìm thấy đơn hàng.</p>
        <a data-href="index.html" class="btn btn-forest">Về trang chủ</a>
      </div>
      <div id="okBody" hidden>
        <div class="text-center mb-4">
          <div class="display-4 text-forest mb-2"><i class="fa-solid fa-circle-check"></i></div>
          <h1 class="h2 font-serif">Đặt hàng thành công</h1>
          <p class="text-muted-fw">Cảm ơn bạn! Đơn đang ở trạng thái <strong>Chờ xử lý</strong>, đối tác sẽ xác nhận sớm.</p>
        </div>
        <div class="p-4 bg-white border rounded-4 mb-3">
          <dl class="row mb-0">
            <dt class="col-sm-4 fw-normal text-muted-fw">Mã đơn</dt><dd class="col-sm-8 fw-bold" id="oCode"></dd>
            <dt class="col-sm-4 fw-normal text-muted-fw">Số sản phẩm</dt><dd class="col-sm-8" id="oCount"></dd>
            <dt class="col-sm-4 fw-normal text-muted-fw">Tổng tiền</dt><dd class="col-sm-8 text-rose fw-bold" id="oTotal"></dd>
            <dt class="col-sm-4 fw-normal text-muted-fw">Giao đến</dt><dd class="col-sm-8 mb-0" id="oShip"></dd>
          </dl>
        </div>
        <form id="invoiceForm" class="p-4 bg-white border rounded-4 mb-3" novalidate>
          <h2 class="h6 mb-2">Gửi hoá đơn qua email</h2>
          <div class="d-flex gap-2">
            <input name="email" type="email" class="form-control" placeholder="email@vidu.com" aria-label="Email nhận hoá đơn" required>
            <button class="btn btn-peach" type="submit">Gửi hoá đơn</button>
          </div>
          <p id="invoiceMsg" class="small mt-2 mb-0" aria-live="polite"></p>
        </form>
        <div class="d-flex gap-2 justify-content-center">
          <a data-href="index.html" class="btn btn-ghost">Về trang chủ</a>
          <a data-href="account/orders.html" class="btn btn-forest">Xem đơn hàng của tôi</a>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/common.js"></script>
<script src="../js/api.js"></script>
<script src="../js/pages/shop-payment-success.js"></script>
</body>
</html>
