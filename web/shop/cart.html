<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giỏ hàng — Fw12 Floral</title>
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap">
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body data-nav="">

<div id="site-header"></div>

<main>
  <section class="section pt-5">
    <div class="container">
      <h1 class="h2 font-serif mb-4">Giỏ hàng</h1>
      <div id="cartEmpty" class="text-center py-5" hidden>
        <p class="text-muted-fw">Giỏ hàng đang trống. Chọn một mẫu hoa để bắt đầu.</p>
        <a data-href="shop/products.html" class="btn btn-forest">Xem mẫu hoa</a>
      </div>
      <div class="row g-4" id="cartBody" hidden>
        <div class="col-lg-8"><div id="cartLines" class="d-grid gap-3"></div></div>
        <div class="col-lg-4">
          <div class="p-4 bg-white border rounded-4">
            <h2 class="h5 font-serif mb-3">Tóm tắt đơn</h2>
            <form id="voucherForm" class="d-flex gap-2 mb-1">
              <input name="code" class="form-control" placeholder="Mã voucher" aria-label="Mã voucher">
              <button class="btn btn-peach" type="submit">Áp dụng</button>
            </form>
            <p id="voucherMsg" class="small mb-3" aria-live="polite"></p>
            <dl class="d-flex justify-content-between mb-1"><dt class="fw-normal">Tạm tính</dt><dd id="subtotal" class="mb-0"></dd></dl>
            <dl class="d-flex justify-content-between mb-1"><dt class="fw-normal">Giảm giá</dt><dd id="discount" class="mb-0"></dd></dl>
            <dl class="d-flex justify-content-between fw-bold border-top pt-2"><dt>Tổng cộng</dt><dd id="total" class="mb-0 text-rose"></dd></dl>
            <a data-href="shop/checkout.html" class="btn btn-forest w-100">Tiến hành đặt hàng</a>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/common.js"></script>
<script src="../js/api.js"></script>
<script src="../js/pages/shop-cart.js"></script>
</body>
</html>
