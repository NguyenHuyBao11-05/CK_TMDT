<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mẫu hoa có sẵn — Fw12 Floral</title>
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap">
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body data-nav="products">

<div id="site-header"></div>

<main>
  <section class="section pt-5">
    <div class="container">
      <h1 class="h2 font-serif mb-1">Mẫu hoa có sẵn</h1>
      <p id="resultInfo" class="text-muted-fw mb-4" aria-live="polite"></p>
      <div class="row g-4">
        <aside class="col-lg-3">
          <form id="filterForm" class="p-3 bg-white border rounded-4">
            <h2 class="h6 mb-2">Chất liệu</h2>
            <div id="materialChecks" class="mb-3"></div>
            <h2 class="h6 mb-2">Khoảng giá</h2>
            <select name="price" class="form-select mb-3" aria-label="Khoảng giá">
              <option value="0-Infinity">Tất cả mức giá</option>
              <option value="0-1000000">Dưới 1.000.000 đ</option>
              <option value="1000000-2000000">1.000.000 – 2.000.000 đ</option>
              <option value="2000000-Infinity">Trên 2.000.000 đ</option>
            </select>
            <button type="reset" class="btn btn-ghost w-100">Xoá bộ lọc</button>
          </form>
        </aside>
        <div class="col-lg-9">
          <div class="d-flex justify-content-end mb-3">
            <select id="sortSelect" class="form-select w-auto" aria-label="Sắp xếp">
              <option value="popular">Nổi bật</option>
              <option value="price-asc">Giá thấp đến cao</option>
              <option value="price-desc">Giá cao đến thấp</option>
              <option value="rating">Đánh giá cao nhất</option>
            </select>
          </div>
          <div class="row g-3" id="productList"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/common.js"></script>
<script src="../js/api.js"></script>
<script src="../js/pages/shop-products.js"></script>
</body>
</html>
