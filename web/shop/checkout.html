<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xác nhận đơn hàng — Fw12 Floral</title>
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap">
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body data-nav="">

<div id="site-header"></div>

<main>
  <section class="section pt-5">
    <div class="container">
      <h1 class="h2 font-serif mb-4">Xác nhận đơn hàng</h1>
      <div class="row g-4">
        <div class="col-lg-7">
          <form id="checkoutForm" class="p-4 bg-white border rounded-4" novalidate>
            <h2 class="h5 font-serif mb-3">Thông tin giao nhận</h2>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="fName">Họ tên người nhận</label>
                <input id="fName" name="name" class="form-control" required maxlength="150">
                <div class="invalid-feedback">Vui lòng nhập họ tên.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="fPhone">Số điện thoại</label>
                <input id="fPhone" name="phone" class="form-control" inputmode="tel" required placeholder="0901234567">
                <div class="invalid-feedback">Số điện thoại chưa đúng (10 số, bắt đầu bằng 0).</div>
              </div>
              <div class="col-12">
                <label class="form-label" for="fAddress">Địa chỉ giao hàng</label>
                <input id="fAddress" name="address" class="form-control" required maxlength="500">
                <div class="invalid-feedback">Vui lòng nhập địa chỉ.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="fDate">Ngày giao</label>
                <input id="fDate" name="date" type="date" class="form-control" required>
                <div class="invalid-feedback">Chọn ngày giao từ hôm nay trở đi.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="fSlot">Khung giờ</label>
                <select id="fSlot" name="slot" class="form-select">
                  <option>8:00 – 11:00</option><option>11:00 – 14:00</option>
                  <option>14:00 – 17:00</option><option>17:00 – 20:00</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label" for="fNote">Lời nhắn / ghi chú (không bắt buộc)</label>
                <textarea id="fNote" name="note" class="form-control" rows="2" maxlength="300"></textarea>
              </div>
            </div>
          </form>
        </div>
        <div class="col-lg-5">
          <div class="p-4 bg-white border rounded-4">
            <h2 class="h5 font-serif mb-3">Đơn hàng của bạn</h2>
            <div id="orderLines" class="d-grid gap-2 mb-3"></div>
            <dl class="d-flex justify-content-between mb-1"><dt class="fw-normal">Tạm tính</dt><dd id="sSub" class="mb-0"></dd></dl>
            <dl class="d-flex justify-content-between mb-1"><dt class="fw-normal">Giảm giá <span id="sCode" class="small text-muted-fw"></span></dt><dd id="sDisc" class="mb-0"></dd></dl>
            <dl class="d-flex justify-content-between fw-bold border-top pt-2"><dt>Tổng cộng</dt><dd id="sTotal" class="mb-0 text-rose"></dd></dl>
            <button type="submit" form="checkoutForm" class="btn btn-forest w-100">Tiếp tục thanh toán</button>
            <a data-href="shop/cart.html" class="btn btn-ghost w-100 mt-2">Quay lại giỏ hàng</a>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/common.js"></script>
<script src="../js/api.js"></script>
<script src="../js/pages/shop-checkout.js"></script>
</body>
</html>
