<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý đơn hàng — Fw12 Floral</title>
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/portal.css">
  <link rel="stylesheet" href="../css/partner.css">
</head>
<body class="partner-page" data-partner-nav="orders">

<div id="site-header"></div>
<div id="sidebar"></div>

<main class="partner-main">
  <header class="partner-header">
    <div>
      <div class="eyebrow">Đơn hàng &amp; giao nhận trực tiếp</div>
      <h1 class="partner-title">Quản lý đơn hàng</h1>
      <p class="partner-subtitle">Theo dõi từng bước tiếp nhận, hoàn thiện cắm hoa đến khâu bàn giao vận chuyển.</p>
    </div>
    <div class="partner-actions">
      <span class="filter-chip"><i class="fa-solid fa-circle-check"></i> 8 đơn hôm nay</span>
      <span class="filter-chip filter-chip-alert"><i class="fa-solid fa-clock"></i> 2 cần xác nhận</span>
    </div>
  </header>

  <div class="partner-toolbar">
    <label class="partner-search"><i class="fa-solid fa-magnifying-glass"></i><input id="orderSearch" type="search" placeholder="Tìm mã đơn, tên khách hàng, số điện thoại..."></label>
    <select id="orderTypeFilter" class="form-select"><option value="">Loại đơn: Tất cả</option><option value="Mẫu có sẵn">Mẫu có sẵn</option><option value="Thiết kế riêng">Thiết kế riêng</option></select>
    <button type="button" class="partner-secondary-btn"><i class="fa-solid fa-sliders"></i> Bộ lọc nâng cao</button>
    <button type="button" class="partner-primary-btn"><i class="fa-solid fa-plus"></i> Thêm đơn trực tiếp</button>
  </div>

  <div class="partner-kanban" id="orderBoard"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/common.js"></script>
<script src="../js/pages/partner-navigation.js"></script>
<script src="../js/api.js"></script>
<script src="../js/pages/partner-orders.js"></script>
</body>
</html>
